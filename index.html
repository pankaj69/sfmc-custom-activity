<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Activity</title>
</head>
<body>
    <div id="status" style="font-family:monospace;padding:15px;font-size:12px;line-height:1.6;"></div>
    <script>
    (function() {
        var payload = {};
        var eventKey = '';
        var statusEl = document.getElementById('status');
        var logs = [];
        var keyFound = false;

        function addLog(msg) {
            logs.push(msg);
            statusEl.innerHTML = logs.join('<br>');
        }

        function post(type, data) {
            var msg = { type: type };
            if (data !== undefined) msg.payload = data;
            window.parent.postMessage(msg, '*');
            addLog('→ ' + type);
        }

        function buildArgs() {
            payload.arguments = payload.arguments || {};
            payload.arguments.execute = payload.arguments.execute || {};
            if (eventKey) {
                payload.arguments.execute.inArguments = [
                    {"subscriberKey": "{{Contact.Key}}"},
                    {"emailAddress": "{{Event." + eventKey + ".EmailAddress}}"},
                    {"leadId": "{{Event." + eventKey + ".LeadId}}"},
                    {"leadSource": "{{Event." + eventKey + ".LeadSource}}"},
                    {"company": "{{Event." + eventKey + ".Company}}"},
                    {"productInterest": "{{Event." + eventKey + ".ProductInterest}}"},
                    {"leadScore": "{{Event." + eventKey + ".LeadScore}}"},
                    {"createdDate": "{{Event." + eventKey + ".CreatedDate}}"}
                ];
            }
            payload.metaData = payload.metaData || {};
            payload.metaData.isConfigured = true;
            post('updateActivity', payload);
        }

        window.addEventListener('message', function(e) {
            var d = e.data;
            if (typeof d === 'string') {
                try { d = JSON.parse(d); } catch(x) { return; }
            }
            if (!d || !d.type) return;

            addLog('← ' + d.type);

            if (d.type === 'initActivity') {
                payload = d.payload || {};
                post('requestTriggerEventDefinition');

                setTimeout(function() {
                    if (!keyFound) {
                        addLog('⏱ Trying requestInteraction...');
                        post('requestInteraction');
                    }
                }, 2000);

                setTimeout(function() {
                    if (!keyFound) {
                        addLog('⚠ No event key detected. Configuring with subscriberKey only.');
                        buildArgs();
                    }
                }, 4000);
            }

            if (d.type === 'requestedTriggerEventDefinition') {
                eventKey = (d.payload || {}).eventDefinitionKey || '';
                if (eventKey) { keyFound = true; addLog('✓ KEY: ' + eventKey); buildArgs(); }
            }

            if (d.type === 'requestedInteraction') {
                var triggers = (d.payload || {}).triggers || [];
                if (triggers.length > 0) {
                    eventKey = (triggers[0].metaData || {}).eventDefinitionKey
                           || ((triggers[0].arguments || {}).eventDefinitionKey)
                           || '';
                }
                if (eventKey) { keyFound = true; addLog('✓ KEY: ' + eventKey); }
                buildArgs();
            }

            if (d.type === 'clickedNext' || d.type === 'clickedDone') {
                buildArgs();
                post('nextStep');
            }
        }, false);

        addLog('Activity loaded');
        post('ready');
    })();
    </script>
</body>
</html>
