<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Activity</title>
    <script src="https://cdn.jsdelivr.net/npm/postmonger@1.0.6/postmonger.js"></script>
</head>
<body>
    <p id="status" style="font-family:Arial;padding:20px;">Loading...</p>
    <script>
    (function() {
        var connection = new Postmonger.Session();
        var payload = {};
        var eventKey = '';

        connection.trigger('ready');

        connection.on('initActivity', function(data) {
            payload = data || {};
            connection.trigger('requestTriggerEventDefinition');
        });

        connection.on('requestedTriggerEventDefinition', function(data) {
            eventKey = (data || {}).eventDefinitionKey || '';
            document.getElementById('status').textContent = eventKey
                ? '✓ Configured (Key: ' + eventKey + ')'
                : '✓ Configured (No event key found)';
            buildAndUpdate();
        });

        connection.on('clickedNext', function() {
            buildAndUpdate();
            connection.trigger('nextStep');
        });

        connection.on('clickedDone', function() {
            buildAndUpdate();
            connection.trigger('nextStep');
        });

        function buildAndUpdate() {
            payload.arguments = payload.arguments || {};
            payload.arguments.execute = payload.arguments.execute || {};

            if (eventKey) {
                payload.arguments.execute.inArguments = [
                    {"subscriberKey": "{{Contact.Key}}"},
                    {"emailAddress": "{{Event." + eventKey + ".EmailAddress}}"},
                    {"leadId": "{{Event." + eventKey + ".LeadId}}"},
                    {"leadSource": "{{Event." + eventKey + ".LeadSource}}"},
                    {"company": "{{Event." + eventKey + ".Company}}"},
                    {"productInterest": "{{Event." + eventKey + ".ProductInterest}}"},
                    {"leadScore": "{{Event." + eventKey + ".LeadScore}}"},
                    {"createdDate": "{{Event." + eventKey + ".CreatedDate}}"}
                ];
            }

            payload.metaData = payload.metaData || {};
            payload.metaData.isConfigured = true;
            connection.trigger('updateActivity', payload);
        }
    })();
    </script>
</body>
</html>
