<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Configure Sprinklr Survey</title>
  <script src="https://code.s1.exacttarget.com/1.0/postmonger.js"></script>
</head>
<body>
  <h3>Sprinklr Survey Configuration</h3>
  <p>This activity will send contact data to the Sprinklr webhook.</p>
  <p>No additional configuration needed for testing.</p>

  <script>
    'use strict';
    var connection = new Postmonger.Session();
    var payload = {};

    connection.on('initActivity', function(data) {
      payload = data;
      // Mark as configured immediately (no user input needed for test)
      payload['metaData'].isConfigured = true;
      connection.trigger('updateActivity', payload);
    });

    connection.on('requestedInteraction', function(interaction) {
      console.log('interaction:', interaction);
    });

    connection.on('clickedNext', function() {
      payload['metaData'].isConfigured = true;
      connection.trigger('updateActivity', payload);
    });

    connection.trigger('ready');
    connection.trigger('requestInteraction');
  </script>
</body>
</html>
